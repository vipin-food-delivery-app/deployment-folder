apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  labels:
    app.kubernetes.io/name: myingress
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: angular-service
            port:
              number: 80
      - pathType: Prefix
        path: /foodCatalogue
        backend:
          service:
            name: foodcatalogue-service
            port:
              number: 9092
      - pathType: Prefix
        path: /restaurant
        backend:
          service:
            name: restaurant-service
            port:
              number: 9091
      - pathType: Prefix
        path: /user
        backend:
          service:
            name: userinfo-service
            port:
              number: 9093
      - pathType: Prefix
        path: /order
        backend:
          service:
            name: order-service
            port:
              number: 9094
