apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodcatalogueapp
  labels:
    app: foodcatalogueapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foodcatalogueapp
  template:
    metadata:
      labels:
        app: foodcatalogueapp
    spec:
      containers:
      - name: foodcatalogueapp
        image: vipiiin/foodcatalogue-server:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 9092
        env:
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name:  configmap
                key:  foodcataloguedb_url
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret
                key: postgres-username
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name:  secret
                key:  postgres-password
---
kind: Service
apiVersion: v1
metadata:
  name:  foodcatalogue-service
spec:
  selector:
    app:  foodcatalogueapp
  ports:
  - protocol:  TCP
    port:  9092
    targetPort:  9092