apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderapp
  labels:
    app: orderapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderapp
  template:
    metadata:
      labels:
        app: orderapp
    spec:
      containers:
      - name: orderapp
        image: vipiiin/order-server:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 9094
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-Djdk.tls.client.protocols=TLSv1.2"
          - name: SPRING_MONGODB_URI
            valueFrom:
              configMapKeyRef:
                name:  configmap
                key:  orderdb_url
          - name: SPRING_DATA_MONGODB_DATABASE
            value: "orderdb"
---
kind: Service
apiVersion: v1
metadata:
  name:  order-service
spec:
  selector:
    app:  orderapp
  ports:
  - protocol:  TCP
    port:  9094
    targetPort:  9094