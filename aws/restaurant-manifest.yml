apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurantapp
  labels:
    app: restaurantapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurantapp
  template:
    metadata:
      labels:
        app: restaurantapp
    spec:
      containers:
      - name: restaurantapp
        image: vipiiin/restaurantlisting-server:24
        imagePullPolicy: Always
        ports:
          - containerPort: 9091
        env:
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name:  configmap
                key:  restaurantdb_url
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: secret
                key: postgres-username
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name:  secret
                key:  postgres-password
---
kind: Service
apiVersion: v1
metadata:
  name:  restaurant-service
spec:
  selector:
    app:  restaurantapp
  ports:
  - protocol:  TCP
    port:  9091
    targetPort:  9091